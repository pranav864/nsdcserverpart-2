<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    /* Moving Plane Animation */

.plane{
  position:absolute;
  top:40px;
  left:-200px;
  width:120px;

  animation: fly 12s linear infinite;
}

@keyframes fly{
  0%{
    left:-200px;
    transform: translateY(0px) rotate(5deg);
  }

  25%{
    transform: translateY(-10px) rotate(3deg);
  }

  50%{
    transform: translateY(5px) rotate(-2deg);
  }

  75%{
    transform: translateY(-8px) rotate(2deg);
  }

  100%{
    left:100%;
    transform: translateY(0px) rotate(5deg);
  }
}

    .login-container {
      width: 350px;
      padding: 40px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .login-container h1 {
      margin-bottom: 10px;
      color: #2251b6;
      font-size: 32px;
    }

    .login-container p {
      margin-bottom: 25px;
      color: #6d6d6d;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      transition: 0.3s;
    }

    .input-group input:focus {
      background: white;
      box-shadow: 0 0 10px rgba(140, 120, 255, 0.3);
    }
    body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    background-image:url("susmeme.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #4001fa, #ffffff);
      color: rgb(255, 255, 255);
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgb(255, 255, 255);
    }

    .footer-text {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
    }

    .footer-text a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
 <!-- Moving Plane -->
<img src="plane.png" 
     class="plane" 
     alt="plane">
  <div class="login-container">
    <h1>Welcome</h1>
    <p>Login ✨</p>

    <form>
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>
    </form>

    <div class="footer-text">
      Don't have an account? <a href="sign_up.html">Sign Up</a>
    </div>
  </div>

</body>
</html>
